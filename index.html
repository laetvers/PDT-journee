<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Générateur de plans</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#20242a;font-family:system-ui,sans-serif}.wrap{max-width:1000px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:18px;margin:12px 0}textarea{width:100%;min-height:360px;border:1px solid #bbb;border-radius:10px;padding:12px;font:14px monospace}button{border:0;border-radius:10px;padding:11px 15px;margin:8px 6px 0 0;font-weight:700;cursor:pointer}.primary{background:#20242a;color:#fff}.secondary{background:#e8eaed}.muted{color:#6b7280}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef0f4;margin:3px;font-size:.8rem}.error{color:#a61b1b}.ok{color:#176b35}#pages{display:none}.document{width:210mm;max-width:100%;margin:12px auto}.document-title{background:#fff;padding:14mm 14mm 8mm;margin:0;border-bottom:2px solid #222}.document-section{background:#fff;width:210mm;max-width:100%;padding:8mm 14mm 14mm;margin:0 auto 12px}.document-section.section-break{break-before:page;page-break-before:always}.document-section h2{margin-top:8px;margin-bottom:12px;border-bottom:1px solid #aaa;padding-bottom:4px}.document-section h3,.document-section h4{break-after:avoid}.document-section p,.document-section li{font-size:10.5pt;line-height:1.45}.document-section ul,.document-section ol{padding-left:22px}.document-section table{border-collapse:collapse;width:100%;margin:10px 0;font-size:10pt}.document-section td,.document-section th{border:1px solid #999;padding:5px;vertical-align:top}.document-section blockquote{border-left:4px solid #aaa;margin:12px 0;padding:4px 12px;color:#555}.student-doc .document-section p,.student-doc .document-section li{font-size:12pt;line-height:1.5}.answer-space{height:1.25em;border-bottom:1px solid #888;margin:5px 0 9px}.answer-space.large{height:2.5em}.projection{display:none;position:fixed;inset:0;background:#fff;color:#111;z-index:20;overflow:auto;padding:4vh 6vw}.projection.active{display:block}.projection-controls{position:sticky;top:0;display:flex;gap:8px;justify-content:center;background:#fffffff0;padding:8px;z-index:2}.slide{min-height:78vh;display:flex;flex-direction:column;justify-content:center;max-width:1400px;margin:auto}.slide h1{font-size:clamp(2rem,4vw,4rem);margin:.2em 0 .5em}.slide h2{font-size:clamp(1.8rem,3vw,3rem);border-bottom:2px solid #888;padding-bottom:.2em}.slide .slide-content{font-size:clamp(1.4rem,2.4vw,2.5rem);line-height:1.45}.slide li{margin:.45em 0}.slide p{margin:.55em 0}@media(max-width:700px){.wrap{padding:10px}.document{width:auto}.document-title,.document-section{width:auto;padding:18px}}@media print{@page{size:A4;margin:0}body{background:#fff}.wrap,.projection-controls{display:none!important}#pages{display:block!important}.projection{display:none!important}.document{display:none;width:210mm;max-width:none;margin:0}.document.printing{display:block}.document-title{width:210mm;max-width:none;padding:14mm 14mm 8mm}.document-section{width:210mm;max-width:none;padding:8mm 14mm 14mm;margin:0}.document-section.section-break{break-before:page;page-break-before:always}}
</style>
</head>
<body>
<div class="wrap">
<div class="card"><h1>📚 Générateur de plans de travail</h1><p class="muted">Source des compétences : dépôt public Sephi-Chan/progression. Les évaluations et devoirs ne sont pas générés dans cette version.</p><textarea id="plan" placeholder="Colle ici ton plan de journée…"></textarea><br><button class="primary" onclick="generate()">Générer les documents</button><button class="secondary" onclick="printDoc('teacher')">PDF enseignant</button><button class="secondary" onclick="printDoc('student')">PDF élèves</button><button class="secondary" onclick="showProjection()">Version à projeter</button></div>
<div class="card"><strong>Codes détectés</strong><div id="detected" class="muted">—</div></div><div class="card"><div id="status">Prêt.</div></div>
</div><div id="pages"></div><div id="projection" class="projection"><div class="projection-controls"><button onclick="previousSlide()">← Précédent</button><span id="slideCount" style="align-self:center"></span><button onclick="nextSlide()">Suivant →</button><button onclick="exitProjection()">Quitter</button></div><div id="slides"></div></div>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
const TREE_API='https://api.github.com/repos/Sephi-Chan/progression/git/trees/main?recursive=1';
const RAW_BASE='https://raw.githubusercontent.com/Sephi-Chan/progression/main/';
let pathsByCode={};
function msg(t,c=''){const e=document.getElementById('status');e.textContent=t;e.className=c}
function esc(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function parsePlan(text){
 const lines=text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean),out=[];let kind=null;
 for(let i=0;i<lines.length;i++){
  const line=lines[i];
  if(/^Le$/i.test(line)){kind='lesson';continue}if(/^Mo$/i.test(line)){kind='model';continue}if(/^En$/i.test(line)){kind='training';continue}if(/^TC$/i.test(line)){kind='tc';continue}if(/^Év$|^Ev$/i.test(line)){kind='eval';continue}if(/^Devoir$/i.test(line)){kind='homework';continue}
  const m=line.match(/^([A-Z]{2,8}\d+)(?:\s*[–-]\s*(.*))?$/);if(!m)continue;
  let title=(m[2]||'').trim();
  if(!title&&lines[i+1]&&!/^(Le|Mo|En|TC|Év|Ev|Devoir)$/i.test(lines[i+1])&&!/^[A-Z]{2,8}\d+(?:\s*[–-]|$)/.test(lines[i+1]))title=lines[i+1];
  let series=null;for(let j=i+1;j<Math.min(lines.length,i+5);j++){const sm=lines[j].match(/(?:^|\s)(\d+)\s*\/\s*\d+(?:\s|$)/);if(sm){series=Number(sm[1]);break}}
  out.push({code:m[1].toUpperCase(),title:title||m[1].toUpperCase(),kind,series});
 }return out;
}
async function loadTree(){
 msg('Recherche des compétences dans GitHub…');
 const r=await fetch(TREE_API,{headers:{'Accept':'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub ne répond pas correctement ('+r.status+').');
 const d=await r.json();if(d.truncated)throw Error('GitHub a tronqué la liste des fichiers.');
 pathsByCode={};for(const x of(d.tree||[])){if(x.type!=='blob'||!/\.md$/i.test(x.path)||!x.path.startsWith('competences/'))continue;const c=x.path.split('/').pop().replace(/\.md$/i,'').toUpperCase();if(/^[A-Z]{2,8}\d+$/.test(c)&&!pathsByCode[c])pathsByCode[c]=x.path}
 if(!Object.keys(pathsByCode).length)throw Error('Aucun fichier .md trouvé dans competences/.');
}
async function getMd(c){const p=pathsByCode[c];if(!p)throw Error('Compétence '+c+' introuvable dans competences/.');const r=await fetch(RAW_BASE+p);if(!r.ok)throw Error('Impossible de lire '+c+'.md ('+r.status+').');return r.text()}
function extract(t,startRe,nextRe){if(!t)return '';const a=t.split(/\r?\n/),s=a.findIndex(x=>startRe.test(x));if(s<0)return '';let e=a.length;for(let i=s+1;i<a.length;i++){if(nextRe.test(a[i])){e=i;break}}return a.slice(s,e).join('\n').trim()}
function lesson(t){return extract(t,/^#{1,6}\s+Leçon explicite\b/i,/^#{1,6}\s+/)}
function model(t){return extract(t,/^#{1,6}\s+Modelage explicite\b/i,/^#{1,6}\s+/)}
function tc(t){return extract(t,/^#{1,6}\s+À toi de jouer\b/i,/^#{1,6}\s+/)}
function training(t,n){return n?extract(t,new RegExp('^#{1,6}\\s*Entra[iî]nement\\s*0?'+n+'\\b','i'),/^#{1,6}\s+/):''}
function support(t){const a=t.split(/\r?\n/),s=a.findIndex(x=>/^#{1,6}\s*Support commun\b/i.test(x));if(s<0)return '';let e=a.length;for(let i=s+1;i<a.length;i++)if(/^#{1,6}\s*(Modelage explicite|À toi de jouer|Entra[iî]nements?)\b/i.test(a[i])){e=i;break}return a.slice(s,e).join('\n').trim()}
function sectionFor(t,x){if(x.kind==='lesson')return lesson(t);if(x.kind==='model')return model(t);if(x.kind==='training')return training(t,x.series);if(x.kind==='tc')return tc(t);return ''}
function addAnswerSpaces(html){
 const holder=document.createElement('div');holder.innerHTML=marked.parse(html||'');
 holder.querySelectorAll('li').forEach(el=>{if(!el.querySelector('.answer-space')){const d=document.createElement('div');d.className='answer-space';el.appendChild(d)}});
 holder.querySelectorAll('p').forEach(el=>{const txt=(el.textContent||'').trim();if(txt && (/[?：:]$/.test(txt)||/^\d+[.)]/.test(txt)) && !el.querySelector('.answer-space')){const d=document.createElement('div');d.className='answer-space';el.after(d)}});
 return holder.innerHTML;
}
function renderDoc(title,items,role){return `<div class="document ${role==='student'?'student-doc':''}" data-role="${role}"><h1 class="document-title">${esc(title)}</h1>`+items.map((x,i)=>`<article class="document-section ${i?'section-break':''}"><h2>${esc(x.code)} — ${esc(x.title)}</h2>${role==='student'?addAnswerSpaces(x.html):marked.parse(x.html||'<p>Section non trouvée dans le fichier source.</p>')}</article>`).join('')+'</div>'}
let projectionSlides=[],slideIndex=0;
function showProjection(){if(!projectionSlides.length){msg('Génère d’abord les documents.','error');return}document.getElementById('projection').classList.add('active');document.getElementById('wrap')?.classList.add('hidden');renderSlide();}
function renderSlide(){const root=document.getElementById('slides');root.innerHTML='';const x=projectionSlides[slideIndex];root.innerHTML=`<section class="slide"><h1>${esc(x.heading)}</h1><div class="slide-content">${x.html}</div></section>`;document.getElementById('slideCount').textContent=`${slideIndex+1} / ${projectionSlides.length}`}
function previousSlide(){slideIndex=Math.max(0,slideIndex-1);renderSlide()}function nextSlide(){slideIndex=Math.min(projectionSlides.length-1,slideIndex+1);renderSlide()}function exitProjection(){document.getElementById('projection').classList.remove('active')}
function printDoc(role){const docs=[...document.querySelectorAll('.document')];if(!docs.length){msg('Génère d’abord les documents.','error');return}docs.forEach(d=>d.classList.toggle('printing',d.dataset.role===role));window.print();setTimeout(()=>docs.forEach(d=>d.classList.remove('printing')),300)}
async function generate(){
 try{
  const pages=document.getElementById('pages');pages.style.display='none';pages.innerHTML='';
  const plan=document.getElementById('plan').value;if(!plan.trim())throw Error('Colle d’abord ton plan de journée.');
  const items=parsePlan(plan).filter(x=>x.kind!=='eval'&&x.kind!=='homework');if(!items.length)throw Error('Aucun code détecté. Utilise les sections Le, Mo, En ou TC puis les codes COMP2, GM1, etc.');
  document.getElementById('detected').innerHTML=items.map(x=>`<span class="pill">${esc(x.code+(x.series?' · '+x.kind+' '+x.series:' · '+(x.kind||'compétence')))}</span>`).join('');
  await loadTree();msg('Chargement des fichiers Markdown…');
  const pairs=await Promise.all([...new Set(items.map(x=>x.code))].map(async c=>[c,await getMd(c)])),md=Object.fromEntries(pairs),teacher=[],student=[];
  for(const x of items){const t=md[x.code]||'';if(x.kind==='lesson'||x.kind==='model'){const h=sectionFor(t,x);if(h)teacher.push({...x,html:h})}
   if(x.kind==='training'||x.kind==='tc'){let h=sectionFor(t,x);if(x.kind==='training'&&!h)h=tc(t);const s=support(t);if(s)h=s+(h?'\n\n'+h:'');if(h)student.push({...x,html:h})}}
  if(!teacher.length&&!student.length)throw Error('Les fichiers ont été trouvés, mais aucune section ne correspond aux éléments du plan.');
  pages.innerHTML=(teacher.length?renderDoc('Plan de journée — Enseignant',teacher,'teacher'):'')+(student.length?renderDoc('Plan de journée — Élèves',student,'student'):'');pages.style.display='block';
  projectionSlides=[];for(const x of [...teacher,...student]){projectionSlides.push({heading:x.code+' — '+x.title,html:marked.parse(x.html||'')})}slideIndex=0;
  msg('Documents prêts : PDF enseignant, PDF élèves avec espaces de réponse et version à projeter.','ok');pages.scrollIntoView({behavior:'smooth'});
 }catch(e){console.error(e);msg('Erreur : '+e.message,'error')}
}
</script>
</body></html>
